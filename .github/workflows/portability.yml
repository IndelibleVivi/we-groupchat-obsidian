name: Portability

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: portability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-import:
    # This check name is required by the repository's main-branch ruleset.
    name: Windows x64 / Python 3.11 import boundary
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
      - name: Install base and Windows-safe dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Windows storage, locks, paths, credentials, and public boundary
        run: >-
          python -m unittest
          tests.windows
          tests.test_repository_layout
          tests.test_state_storage
          tests.test_keychain
          tests.test_ai_factory
          tests.test_google_drive_auth.ProtectedRefreshTokenStoreTests
          tests.test_config.ConfigTests.test_config_store_preserves_concurrent_disjoint_process_updates
          tests.test_monitor_state.MonitorStateStoreTests.test_two_processes_cannot_replace_the_same_revision
          tests.test_source_inventory.SourceInventoryStoreTests.test_concurrent_reconcile_preserves_inventory_union_and_revisions
      - name: Compile Windows-owned source surfaces
        run: >-
          python -m compileall -q
          mcp_server.py ai core ui scripts tests

  macos-regression:
    name: macOS / Python ${{ matrix.python-version }} regression
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install macOS dependencies (app only, no MCP SDK)
        run: python -m pip install -r requirements.txt
      - name: Verify ordinary app bootstrap ignores the optional MCP SDK
        run: python -m unittest tests.test_mcp_optional
      # The optional SDK is installed only after the base-only bootstrap check,
      # so the full suite below still exercises the legacy read-only MCP
      # contract instead of silently skipping it.
      - name: Install optional MCP SDK
        run: python -m pip install -r requirements-mcp.txt
      - name: Run full macOS regression suite
        run: >-
          python -m unittest discover
          -s tests -t . -p 'test_*.py'
      - name: Compile all source surfaces
        run: >-
          python -m compileall -q
          app.py mcp_server.py setup.py ai core ui scripts tests
      - name: Parse macOS launchers
        run: |
          for launcher in 启动.command launchers/*.command; do
            bash -n "$launcher"
          done
