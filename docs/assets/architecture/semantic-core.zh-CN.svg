<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1030" viewBox="0 0 1520 1030" role="img"><title>WGO semantic knowledge and reading</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446c77"/></marker></defs><rect width="1520" height="1030" fill="#fff"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><rect x="28" y="275" width="1460" height="633" rx="12" fill="#f4f8f8" stroke="#d3e0e3" stroke-width="1.5"/><text x="56" y="58" fill="#193544" font-size="32" font-weight="600"><tspan x="56" dy="0">WGO · 语义知识与阅读</tspan></text><text x="56" y="95" fill="#526f7c" font-size="17" font-weight="600"><tspan x="56" dy="0">源码候选 · generation pin 选择唯一工作流；source 验证不代表已激活</tspan></text><rect x="395" y="133" width="570" height="123" rx="12" fill="#f0eff8" stroke="#78949c" stroke-width="1.5"/><text x="413" y="172" fill="#193544" font-size="21" font-weight="600"><tspan x="413" dy="0">Provider routes</tspan></text><text x="413" y="200" fill="#193544" font-size="16" font-weight="400"><tspan x="413" dy="0">文本生成 / typed decisions：分别绑定 route</tspan><tspan x="413" dy="21.6">Embedding：本机 loopback 或 Cloudflare BGE-M3</tspan></text><rect x="1130" y="133" width="300" height="123" rx="12" fill="#f0eff8" stroke="#78949c" stroke-width="1.5"/><text x="1148" y="172" fill="#193544" font-size="21" font-weight="600"><tspan x="1148" dy="0">Cloudflare Vectorize</tspan></text><text x="1148" y="208" fill="#193544" font-size="17" font-weight="400"><tspan x="1148" dy="0">可选远端派生索引</tspan><tspan x="1148" dy="22.950000000000003">opaque IDs + vectors</tspan><tspan x="1148" dy="22.950000000000003">mutation + readback</tspan></text><text x="52" y="308" fill="#426370" font-size="16" font-weight="600"><tspan x="52" dy="0">本机 authority · 原始库只读；SQLite / checkpoint 各有唯一写者</tspan></text><rect x="56" y="344" width="278" height="166" rx="12" fill="#fff" stroke="#78949c" stroke-width="1.5"/><text x="74" y="383" fill="#193544" font-size="21" font-weight="600"><tspan x="74" dy="0">WeChat source</tspan></text><text x="74" y="419" fill="#193544" font-size="17" font-weight="400"><tspan x="74" dy="0">完整 SourceInventory</tspan><tspan x="74" dy="22.950000000000003">精确 shard / generation</tspan><tspan x="74" dy="22.950000000000003">既有密钥与 source gate</tspan></text><rect x="414" y="344" width="280" height="166" rx="12" fill="#fff" stroke="#78949c" stroke-width="1.5"/><text x="432" y="383" fill="#193544" font-size="21" font-weight="600"><tspan x="432" dy="0">Immutable captures</tspan></text><text x="432" y="419" fill="#193544" font-size="17" font-weight="400"><tspan x="432" dy="0">原始 occurrence 与版本</tspan><tspan x="432" dy="22.950000000000003">完整保存后提交 captured</tspan><tspan x="432" dy="22.950000000000003">C0 / C1 与增量共用</tspan></text><rect x="766" y="344" width="280" height="166" rx="12" fill="#fff" stroke="#78949c" stroke-width="1.5"/><text x="784" y="383" fill="#193544" font-size="21" font-weight="600"><tspan x="784" dy="0">Semantic engine</tspan></text><text x="784" y="419" fill="#193544" font-size="17" font-weight="400"><tspan x="784" dy="0">0–N Observations → Items</tspan><tspan x="784" dy="22.950000000000003">accepted jobs → canonical CAS</tspan><tspan x="784" dy="22.950000000000003">claims / relations / Episodes</tspan></text><rect x="1130" y="344" width="300" height="166" rx="12" fill="#e5f2ef" stroke="#78949c" stroke-width="1.5"/><text x="1148" y="383" fill="#193544" font-size="21" font-weight="600"><tspan x="1148" dy="0">Canonical SQLite</tspan></text><text x="1148" y="419" fill="#193544" font-size="17" font-weight="400"><tspan x="1148" dy="0">Items / Views / change events</tspan><tspan x="1148" dy="22.950000000000003">整批终态才提交 applied</tspan><tspan x="1148" dy="22.950000000000003">index / projection outboxes</tspan></text><rect x="414" y="678" width="280" height="166" rx="12" fill="#e5f2ef" stroke="#78949c" stroke-width="1.5"/><text x="432" y="717" fill="#193544" font-size="21" font-weight="600"><tspan x="432" dy="0">MonitorStateStore v3</tspan></text><text x="432" y="753" fill="#193544" font-size="17" font-weight="400"><tspan x="432" dy="0">captured：已保存原始数据</tspan><tspan x="432" dy="22.950000000000003">applied：已完成语义处理</tspan><tspan x="432" dy="22.950000000000003">同一来源绑定 · revision CAS</tspan></text><rect x="766" y="678" width="280" height="166" rx="12" fill="#fff" stroke="#78949c" stroke-width="1.5"/><text x="784" y="717" fill="#193544" font-size="21" font-weight="600"><tspan x="784" dy="0">Hybrid retrieval</tspan></text><text x="784" y="753" fill="#193544" font-size="17" font-weight="400"><tspan x="784" dy="0">lexical + dense + structure</tspan><tspan x="784" dy="22.950000000000003">本地 cosine 或 Vectorize</tspan><tspan x="784" dy="22.950000000000003">confirmed prefix +</tspan><tspan x="784" dy="22.950000000000003">canonical tail</tspan></text><rect x="1130" y="678" width="300" height="166" rx="12" fill="#fff" stroke="#78949c" stroke-width="1.5"/><text x="1148" y="717" fill="#193544" font-size="21" font-weight="600"><tspan x="1148" dy="0">ReaderRuntime</tspan></text><text x="1148" y="753" fill="#193544" font-size="17" font-weight="400"><tspan x="1148" dy="0">BodyPlan / 查询 / 日简报</tspan><tspan x="1148" dy="22.950000000000003">属性、动作、可见打开证据</tspan><tspan x="1148" dy="22.950000000000003">手改保护 · 去重通知</tspan></text><polyline points="335,427 413,427" fill="none" stroke="#446c77" stroke-width="1.8" marker-end="url(#arrow)"/><text x="337" y="413" fill="#446c77" font-size="14" font-weight="400"><tspan x="337" dy="0">bounded page</tspan></text><polyline points="695,427 765,427" fill="none" stroke="#446c77" stroke-width="1.8" marker-end="url(#arrow)"/><text x="705" y="413" fill="#446c77" font-size="14" font-weight="400"><tspan x="705" dy="0">raw</tspan></text><polyline points="1047,427 1129,427" fill="none" stroke="#446c77" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1071" y="413" fill="#446c77" font-size="14" font-weight="400"><tspan x="1071" dy="0">CAS</tspan></text><polyline points="480,511 480,677" fill="none" stroke="#446c77" stroke-width="1.8" marker-end="url(#arrow)"/><text x="494" y="634" fill="#446c77" font-size="14" font-weight="400"><tspan x="494" dy="0">captured</tspan></text><polyline points="1230,511 1230,560 626,560 626,677" fill="none" stroke="#446c77" stroke-width="1.8" marker-end="url(#arrow)"/><text x="660" y="549" fill="#446c77" font-size="14" font-weight="400"><tspan x="660" dy="0">applied · processing receipt</tspan></text><polyline points="1354,511 1354,677" fill="none" stroke="#446c77" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1360" y="634" fill="#446c77" font-size="14" font-weight="400"><tspan x="1360" dy="0">projection</tspan></text><polyline points="1180,511 1180,606 950,606 950,677" fill="none" stroke="#446c77" stroke-width="1.8" marker-end="url(#arrow)"/><text x="972" y="592" fill="#446c77" font-size="14" font-weight="400"><tspan x="972" dy="0">index outbox</tspan></text><polyline points="815,677 815,511" fill="none" stroke="#446c77" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="827" y="639" fill="#446c77" font-size="14" font-weight="400"><tspan x="827" dy="0">candidates</tspan></text><polyline points="906,343 906,257" fill="none" stroke="#446c77" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="918" y="278" fill="#446c77" font-size="14" font-weight="400"><tspan x="918" dy="0">bounded requests</tspan></text><polyline points="1010,845 1010,879 1460,879 1460,208 1431,208" fill="none" stroke="#446c77" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1270" y="864" fill="#446c77" font-size="14" font-weight="400"><tspan x="1270" dy="0">index client</tspan></text><text x="56" y="957" fill="#193544" font-size="17" font-weight="400"><tspan x="56" dy="0">GenerationRegistry + 迁移 journal：备份 → C0/C1 → 独立对账 → 发布 / v3 / pin → 解锁 → 恢复 → live 验收</tspan></text><text x="56" y="996" fill="#526f7c" font-size="15" font-weight="400"><tspan x="56" dy="0">实线：持久状态与投影　虚线：provider / 检索请求　历史重建不通知；旧路径仅迁移前或明确 rollback</tspan></text></g></svg>
