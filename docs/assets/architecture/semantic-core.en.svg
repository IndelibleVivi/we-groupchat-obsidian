<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1030" viewBox="0 0 1520 1030" role="img"><title>WGO semantic knowledge and reading</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446c77"/></marker></defs><rect width="1520" height="1030" fill="#fff"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><rect x="28" y="275" width="1460" height="633" rx="12" fill="#f4f8f8" stroke="#d3e0e3" stroke-width="1.5"/><text x="56" y="58" fill="#193544" font-size="32" font-weight="600"><tspan x="56" dy="0">WGO · Semantic knowledge and reading</tspan></text><text x="56" y="95" fill="#526f7c" font-size="17" font-weight="600"><tspan x="56" dy="0">Source candidate · one generation pin selects the runtime; source verification is not activation</tspan></text><rect x="395" y="133" width="570" height="123" rx="12" fill="#f0eff8" stroke="#78949c" stroke-width="1.5"/><text x="413" y="172" fill="#193544" font-size="21" font-weight="600"><tspan x="413" dy="0">Provider routes</tspan></text><text x="413" y="200" fill="#193544" font-size="16" font-weight="400"><tspan x="413" dy="0">Text / typed decisions · explicit routes</tspan><tspan x="413" dy="21.6">Embedding · local loopback or Cloudflare BGE-M3</tspan></text><rect x="1130" y="133" width="300" height="123" rx="12" fill="#f0eff8" stroke="#78949c" stroke-width="1.5"/><text x="1148" y="172" fill="#193544" font-size="21" font-weight="600"><tspan x="1148" dy="0">Cloudflare Vectorize</tspan></text><text x="1148" y="208" fill="#193544" font-size="17" font-weight="400"><tspan x="1148" dy="0">Optional remote derived index</tspan><tspan x="1148" dy="22.950000000000003">Opaque IDs + vectors</tspan><tspan x="1148" dy="22.950000000000003">Mutation + readback</tspan></text><text x="52" y="308" fill="#426370" font-size="16" font-weight="600"><tspan x="52" dy="0">LOCAL AUTHORITIES · read-only source; canonical SQLite and checkpoint have separate owners</tspan></text><rect x="56" y="344" width="278" height="166" rx="12" fill="#fff" stroke="#78949c" stroke-width="1.5"/><text x="74" y="383" fill="#193544" font-size="21" font-weight="600"><tspan x="74" dy="0">WeChat source</tspan></text><text x="74" y="419" fill="#193544" font-size="17" font-weight="400"><tspan x="74" dy="0">Complete SourceInventory</tspan><tspan x="74" dy="22.950000000000003">Exact shard / generation</tspan><tspan x="74" dy="22.950000000000003">Existing keys and source gate</tspan></text><rect x="414" y="344" width="280" height="166" rx="12" fill="#fff" stroke="#78949c" stroke-width="1.5"/><text x="432" y="383" fill="#193544" font-size="21" font-weight="600"><tspan x="432" dy="0">Immutable captures</tspan></text><text x="432" y="419" fill="#193544" font-size="17" font-weight="400"><tspan x="432" dy="0">Raw occurrences and versions</tspan><tspan x="432" dy="22.950000000000003">Store before captured cursor</tspan><tspan x="432" dy="22.950000000000003">C0 / C1 and live share owner</tspan></text><rect x="766" y="344" width="280" height="166" rx="12" fill="#fff" stroke="#78949c" stroke-width="1.5"/><text x="784" y="383" fill="#193544" font-size="21" font-weight="600"><tspan x="784" dy="0">Semantic engine</tspan></text><text x="784" y="419" fill="#193544" font-size="17" font-weight="400"><tspan x="784" dy="0">0–N Observations → Items</tspan><tspan x="784" dy="22.950000000000003">Accepted jobs → canonical CAS</tspan><tspan x="784" dy="22.950000000000003">Claims / relations / Episodes</tspan></text><rect x="1130" y="344" width="300" height="166" rx="12" fill="#e5f2ef" stroke="#78949c" stroke-width="1.5"/><text x="1148" y="383" fill="#193544" font-size="21" font-weight="600"><tspan x="1148" dy="0">Canonical SQLite</tspan></text><text x="1148" y="419" fill="#193544" font-size="17" font-weight="400"><tspan x="1148" dy="0">Items / Views / change events</tspan><tspan x="1148" dy="22.950000000000003">Whole batch before applied</tspan><tspan x="1148" dy="22.950000000000003">Index / projection outboxes</tspan></text><rect x="414" y="678" width="280" height="166" rx="12" fill="#e5f2ef" stroke="#78949c" stroke-width="1.5"/><text x="432" y="717" fill="#193544" font-size="21" font-weight="600"><tspan x="432" dy="0">MonitorStateStore v3</tspan></text><text x="432" y="753" fill="#193544" font-size="17" font-weight="400"><tspan x="432" dy="0">Captured: raw data is durable</tspan><tspan x="432" dy="22.950000000000003">Applied: semantics are complete</tspan><tspan x="432" dy="22.950000000000003">Same source binding · CAS</tspan></text><rect x="766" y="678" width="280" height="166" rx="12" fill="#fff" stroke="#78949c" stroke-width="1.5"/><text x="784" y="717" fill="#193544" font-size="21" font-weight="600"><tspan x="784" dy="0">Hybrid retrieval</tspan></text><text x="784" y="753" fill="#193544" font-size="17" font-weight="400"><tspan x="784" dy="0">Lexical + dense + structure</tspan><tspan x="784" dy="22.950000000000003">Local cosine or Vectorize</tspan><tspan x="784" dy="22.950000000000003">Confirmed prefix +</tspan><tspan x="784" dy="22.950000000000003">canonical tail</tspan></text><rect x="1130" y="678" width="300" height="166" rx="12" fill="#fff" stroke="#78949c" stroke-width="1.5"/><text x="1148" y="717" fill="#193544" font-size="21" font-weight="600"><tspan x="1148" dy="0">ReaderRuntime</tspan></text><text x="1148" y="753" fill="#193544" font-size="17" font-weight="400"><tspan x="1148" dy="0">BodyPlan / query / daily brief</tspan><tspan x="1148" dy="22.950000000000003">Properties, actions, visible-open</tspan><tspan x="1148" dy="22.950000000000003">Manual edits / dedup delivery</tspan></text><polyline points="335,427 413,427" fill="none" stroke="#446c77" stroke-width="1.8" marker-end="url(#arrow)"/><text x="337" y="413" fill="#446c77" font-size="14" font-weight="400"><tspan x="337" dy="0">bounded page</tspan></text><polyline points="695,427 765,427" fill="none" stroke="#446c77" stroke-width="1.8" marker-end="url(#arrow)"/><text x="705" y="413" fill="#446c77" font-size="14" font-weight="400"><tspan x="705" dy="0">raw</tspan></text><polyline points="1047,427 1129,427" fill="none" stroke="#446c77" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1071" y="413" fill="#446c77" font-size="14" font-weight="400"><tspan x="1071" dy="0">CAS</tspan></text><polyline points="480,511 480,677" fill="none" stroke="#446c77" stroke-width="1.8" marker-end="url(#arrow)"/><text x="494" y="634" fill="#446c77" font-size="14" font-weight="400"><tspan x="494" dy="0">captured</tspan></text><polyline points="1230,511 1230,560 626,560 626,677" fill="none" stroke="#446c77" stroke-width="1.8" marker-end="url(#arrow)"/><text x="660" y="549" fill="#446c77" font-size="14" font-weight="400"><tspan x="660" dy="0">applied · processing receipt</tspan></text><polyline points="1354,511 1354,677" fill="none" stroke="#446c77" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1360" y="634" fill="#446c77" font-size="14" font-weight="400"><tspan x="1360" dy="0">projection</tspan></text><polyline points="1180,511 1180,606 950,606 950,677" fill="none" stroke="#446c77" stroke-width="1.8" marker-end="url(#arrow)"/><text x="972" y="592" fill="#446c77" font-size="14" font-weight="400"><tspan x="972" dy="0">index outbox</tspan></text><polyline points="815,677 815,511" fill="none" stroke="#446c77" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="827" y="639" fill="#446c77" font-size="14" font-weight="400"><tspan x="827" dy="0">candidates</tspan></text><polyline points="906,343 906,257" fill="none" stroke="#446c77" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="918" y="278" fill="#446c77" font-size="14" font-weight="400"><tspan x="918" dy="0">bounded requests</tspan></text><polyline points="1010,845 1010,879 1460,879 1460,208 1431,208" fill="none" stroke="#446c77" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1270" y="864" fill="#446c77" font-size="14" font-weight="400"><tspan x="1270" dy="0">index client</tspan></text><text x="56" y="957" fill="#193544" font-size="17" font-weight="400"><tspan x="56" dy="0">GenerationRegistry + cutover journal: backup → C0/C1 → verify → publish / v3 / pin → unlock → restore → live acceptance</tspan></text><text x="56" y="996" fill="#526f7c" font-size="15" font-weight="400"><tspan x="56" dy="0">Solid: durable state / projections   Dashed: provider / retrieval calls   No historical notifications; legacy only before migration or after rollback</tspan></text></g></svg>
